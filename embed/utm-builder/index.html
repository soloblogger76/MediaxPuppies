body{background:transparent;padding:0}
.wrap{max-width:100%;padding:0}
.card{box-shadow:none;margin:0}
.credit{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;

<body>
<main class="wrap">
  <p style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:.82rem;color:rgba(24,28,79,.7)"><label for="cur" style="margin:0;font-weight:700;font-size:.82rem">Currency</label><select id="cur" data-cur-switch aria-label="Currency" style="width:auto;padding:6px 9px;background:#fff;font-size:.82rem"></select></p>
  <div class="card">

    <div class="field"><label for="u_url">Destination URL</label><input id="u_url" type="text" value="https://mediapuppies.com/lead-generation/" placeholder="https://example.com/page"></div><div class="row"><div class="field"><label for="u_source">Campaign source *</label><input id="u_source" type="text" value="facebook" placeholder="google, facebook, newsletter"><p class="hint">Where the traffic comes from.</p></div><div class="field"><label for="u_medium">Campaign medium *</label><input id="u_medium" type="text" value="cpc" placeholder="cpc, email, social, referral"><p class="hint">The channel type.</p></div></div><div class="row"><div class="field"><label for="u_campaign">Campaign name *</label><input id="u_campaign" type="text" value="diwali-2026" placeholder="spring-sale"></div><div class="field"><label for="u_content">Campaign content</label><input id="u_content" type="text" value="carousel-a" placeholder="Use it to tell two ads apart."></div><div class="field"><label for="u_term">Campaign term</label><input id="u_term" type="text" value="" placeholder="Paid search keyword. Usually left blank."></div></div>
    <div class="out">
      <div class="metric"><div class="k">Your tagged URL</div><div class="outurl" id="o_url" style="margin-top:8px">—</div></div><button class="copy" id="o_copy" type="button">Copy URL</button><div id="o_verdict" class="verdict"></div>
    </div>
  </div>
  <p class="credit">
    <span><a href="https://mediapuppies.com/tools/utm-builder/" target="_blank" rel="noopener">UTM campaign URL builder</a> by
    <a href="https://mediapuppies.com/" target="_blank" rel="noopener"><strong>Media Puppies</strong></a></span>
    <a href="https://mediapuppies.com/tools/" target="_blank" rel="noopener">More free tools →</a>
  </p>
</main>
<script>
var MP_SLUG='utm-builder';

function clean(s){return (s||'').trim().toLowerCase().replace(/\s+/g,'-');}
function calc(){
  var base=(v('u_url')||'').trim();
  var el=document.getElementById('o_verdict'), out=document.getElementById('o_url');
  var parts=[['utm_source',clean(v('u_source'))],['utm_medium',clean(v('u_medium'))],
             ['utm_campaign',clean(v('u_campaign'))],['utm_content',clean(v('u_content'))],
             ['utm_term',clean(v('u_term'))]].filter(function(p){return p[1];});
  if(!base){out.textContent='\u2014';el.className='verdict warn';
    el.textContent='Enter a destination URL.';return;}
  var missing=['utm_source','utm_medium','utm_campaign'].filter(function(k){
    return !parts.some(function(p){return p[0]===k;});});
  var u;
  try{ u=new URL(base.indexOf('://')<0?'https://'+base:base); }
  catch(e){ u=null; }
  /* new URL() happily accepts "notaurl!!" as a hostname, so check it looks
     like a real domain before handing someone a link they will paste into an ad. */
  if(!u || !/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(u.hostname)){
    out.textContent='\u2014'; el.className='verdict bad';
    el.textContent='That does not look like a valid URL. It needs a real domain, like example.com.';
    return;
  }
  parts.forEach(function(p){u.searchParams.set(p[0],p[1]);});
  out.textContent=u.toString();
  if(missing.length){el.className='verdict warn';
    el.textContent='Missing '+missing.join(', ')+'. Analytics needs source, medium and campaign to group the traffic properly \u2014 without them the visit lands in "other".';}
  else{el.className='verdict good';
    el.textContent='Ready. Everything is lowercased and spaces are replaced with hyphens, so Facebook and facebook will not show up as two separate sources.';}
}
document.addEventListener('DOMContentLoaded',function(){
  var b=document.getElementById('o_copy');
  b.addEventListener('click',function(){
    var t=document.getElementById('o_url').textContent;
    if(!t||t==='\u2014')return;
    var done=function(){b.textContent='Copied \u2713';setTimeout(function(){b.textContent='Copy URL';},1600);};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done,function(){fallback(t,done);});
    } else fallback(t,done);
  });
  function fallback(t,done){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){}
    document.body.removeChild(ta);
  }
});
function v(id){var e=document.getElementById(id);return e?e.value:'';}
function set(id,val){var e=document.getElementById(id);if(e)e.textContent=val;}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('input,select,textarea').forEach(function(el){
    el.addEventListener('input',calc); el.addEventListener('change',calc);
  });
  calc();
  if(window.mpTrack)window.mpTrack('ViewContent',{content_category:'tool',content_name:document.title});
});

window.calc=calc;

/* Tell the host page how tall we are, so a fixed iframe height is only a
   fallback. Height depends on the host's column width, which we cannot guess. */
(function(){
  var last=0;
  function post(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>4){ last=h;
      try{ parent.postMessage({mpHeight:h, mpSlug:MP_SLUG}, '*'); }catch(e){}
    }
  }
  addEventListener('load',post); addEventListener('resize',post);
  document.addEventListener('input',function(){setTimeout(post,60);});
  document.addEventListener('change',function(){setTimeout(post,60);});
  setInterval(post,1000);
})();
</script>
</body>
