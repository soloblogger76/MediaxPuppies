<body>
<main class="wrap">
  <p style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:.82rem;color:rgba(24,28,79,.7)"><label for="cur" style="margin:0;font-weight:700;font-size:.82rem">Currency</label><select id="cur" data-cur-switch aria-label="Currency" style="width:auto;padding:6px 9px;background:#fff;font-size:.82rem"></select></p>
  <div class="card">

    <div class="field"><label for="s_url">Page URL</label><input id="s_url" type="text" value="https://mediapuppies.com/seo-services/" placeholder="https://example.com/page"></div><div class="field"><label for="s_title">Title tag</label><input id="s_title" type="text" value="SEO Services for Indian Businesses | Media Puppies" placeholder=""></div><div class="field"><label for="s_desc">Meta description</label><textarea id="s_desc" placeholder="">Technical fixes, content built around buying-intent searches, and local visibility — reported in organic leads, not rankings.</textarea></div>
    <div class="out">
      <div class="row"><div class="metric"><div class="k">Title width</div><div class="v" id="o_tw">—</div><div class="s" id="o_tw-s">pixels</div></div><div class="metric"><div class="k">Title characters</div><div class="v" id="o_tc">—</div><div class="s" id="o_tc-s"></div></div><div class="metric"><div class="k">Description width</div><div class="v" id="o_dw">—</div><div class="s" id="o_dw-s">pixels</div></div><div class="metric"><div class="k">Description characters</div><div class="v" id="o_dc">—</div><div class="s" id="o_dc-s"></div></div></div><div style="margin-top:20px"><div class="k" style="font-size:.74rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#FFAC1C;margin-bottom:8px">Desktop preview</div><div class="serp"><div class="u" id="p_url"></div><div class="t" id="p_title"></div><div class="d" id="p_desc"></div></div></div><div id="o_verdict" class="verdict"></div>
    </div>
  </div>
  <p class="credit">
    <span><a href="https://mediapuppies.com/tools/serp-snippet-preview/" target="_blank" rel="noopener">SERP snippet preview</a> by
    <a href="https://mediapuppies.com/" target="_blank" rel="noopener"><strong>Media Puppies</strong></a></span>
    <a href="https://mediapuppies.com/tools/" target="_blank" rel="noopener">More free tools →</a>
  </p>
</main>
<script>
var MP_SLUG='serp-snippet-preview';

/* Google renders desktop titles at roughly 20px Arial and descriptions at 14px.
   Canvas measurement is far closer to reality than counting characters. */
var TITLE_MAX=580, DESC_MAX=920;
var cv=document.createElement('canvas'), cx=cv.getContext('2d');
function width(text,font){cx.font=font;return cx.measureText(text||'').width;}
function truncate(text,font,max){
  if(width(text,font)<=max) return {t:text,cut:false};
  var s=text;
  while(s.length>0 && width(s+'\u2026',font)>max) s=s.slice(0,-1);
  s=s.replace(/\s+\S*$/,'');           /* never cut mid-word */
  return {t:s+'\u2026',cut:true};
}
function calc(){
  var t=v('s_title')||'', d=v('s_desc')||'', u=(v('s_url')||'').trim();
  var tf='700 20px Arial, sans-serif', df='400 14px Arial, sans-serif';
  var tw=width(t,tf), dw=width(d,df);
  set('o_tw',Math.round(tw)); set('o_tc',t.length);
  set('o_dw',Math.round(dw)); set('o_dc',d.length);
  document.getElementById('o_tw-s').textContent='of '+TITLE_MAX+'px';
  document.getElementById('o_dw-s').textContent='of '+DESC_MAX+'px';
  var tt=truncate(t,tf,TITLE_MAX), dd=truncate(d,df,DESC_MAX);
  document.getElementById('p_title').textContent=tt.t||'Your title will appear here';
  document.getElementById('p_desc').textContent=dd.t||'Your meta description will appear here.';
  var pretty=u;
  try{var o=new URL(u.indexOf('://')<0?'https://'+u:u);
      pretty=o.hostname.replace(/^www\./,'')+o.pathname.replace(/\/$/,'').split('/').join(' \u203a ');}
  catch(e){}
  document.getElementById('p_url').textContent=pretty||'example.com';
  var el=document.getElementById('o_verdict'), msgs=[];
  if(tt.cut) msgs.push('Your title is cut off. Move the important words to the front \u2014 Google reads the whole tag, but a searcher only sees what fits.');
  else if(tw<200 && t) msgs.push('The title is short. You have room for another qualifier or the brand name.');
  if(dd.cut) msgs.push('The description is cut off. Put the reason to click in the first sentence.');
  else if(!d) msgs.push('No description. Google will write one from the page, and it is usually worse than yours would be.');
  else if(dw<500) msgs.push('The description is short. Unused space in a result is unused persuasion.');
  if(!msgs.length) msgs.push('Both fit. Remember Google rewrites titles on a large share of queries anyway \u2014 fitting simply improves the odds yours is used.');
  el.className='verdict '+((tt.cut||dd.cut)?'warn':'good');
  el.textContent=msgs.join(' ');
}
function v(id){var e=document.getElementById(id);return e?e.value:'';}
function set(id,val){var e=document.getElementById(id);if(e)e.textContent=val;}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('input,select,textarea').forEach(function(el){
    el.addEventListener('input',calc); el.addEventListener('change',calc);
  });
  calc();
  if(window.mpTrack)window.mpTrack('ViewContent',{content_category:'tool',content_name:document.title});
});

window.calc=calc;

/* Tell the host page how tall we are, so a fixed iframe height is only a
   fallback. Height depends on the host's column width, which we cannot guess. */
(function(){
  var last=0;
  function post(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>4){ last=h;
      try{ parent.postMessage({mpHeight:h, mpSlug:MP_SLUG}, '*'); }catch(e){}
    }
  }
  addEventListener('load',post); addEventListener('resize',post);
  document.addEventListener('input',function(){setTimeout(post,60);});
  document.addEventListener('change',function(){setTimeout(post,60);});
  setInterval(post,1000);
})();
</script>
