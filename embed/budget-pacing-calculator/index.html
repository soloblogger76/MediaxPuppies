<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:#F6F5EF;color:#181C4F;font-family:'Satoshi',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:'Clash Display',sans-serif;letter-spacing:-.02em;margin:0}
h1{font-weight:700;font-size:clamp(1.9rem,4.6vw,2.9rem);line-height:1.08}
h2{font-weight:600;font-size:clamp(1.35rem,3vw,1.8rem);margin:36px 0 12px}
h3{font-weight:600;font-size:1.05rem;margin:20px 0 6px}
p{margin:0 0 14px}
a{color:#3038D8}
code{background:rgba(24,28,79,.07);padding:1px 5px;border-radius:5px;font-size:.92em}
.card{background:#fff;border:1px solid rgba(24,28,79,.12);border-radius:20px;padding:26px 24px;box-shadow:0 14px 36px rgba(24,28,79,.08)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:16px}
label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid rgba(24,28,79,.16);border-radius:10px;font-family:inherit;font-size:1rem;background:#F6F5EF;color:#181C4F}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid #3038D8;outline-offset:1px;border-color:#3038D8}
.hint{font-size:.8rem;color:rgba(24,28,79,.6);margin:6px 0 0}
.field{margin-bottom:4px}
.out{background:linear-gradient(160deg,#1D2260,#181C4F);color:#F6F5EF;border-radius:18px;padding:24px 22px;margin-top:22px}
.out .row{gap:20px}
.metric{min-width:0}
.metric .k{font-size:.74rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#FFAC1C;margin-bottom:5px}
.metric .v{font-family:'Clash Display',sans-serif;font-weight:700;font-size:clamp(1.5rem,4.2vw,2.1rem);line-height:1.05;word-break:break-word}
.metric .s{font-size:.84rem;color:rgba(246,245,239,.66);margin-top:4px}
.verdict{margin-top:18px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.08);font-size:.95rem;color:rgba(246,245,239,.92)}
.warn{border-left:3px solid #FFAC1C}
.good{border-left:3px solid #4ADE80}
.bad{border-left:3px solid #FF8A7A}
.copy{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.9rem;color:#181C4F;background:#FFAC1C;padding:11px 18px;border-radius:999px;margin-top:12px}
.outurl{word-break:break-all;background:rgba(0,0,0,.22);padding:12px 14px;border-radius:10px;font-size:.92rem;line-height:1.5}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid rgba(24,28,79,.12)}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(24,28,79,.62)}
details{border-top:1px solid rgba(24,28,79,.12)}
details summary{cursor:pointer;font-weight:700;padding:15px 0;list-style:none;display:flex;justify-content:space-between;gap:14px}
details summary::-webkit-details-marker{display:none}
details[open] .plus{transform:rotate(45deg)}
.plus{font-family:'Clash Display',sans-serif;font-size:1.25rem;color:#3038D8;transition:transform .2s ease;flex:none;line-height:1}
.bar{height:10px;border-radius:999px;background:rgba(24,28,79,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3038D8,#FFAC1C)}
.serp{background:#fff;border:1px solid rgba(24,28,79,.12);border-radius:12px;padding:16px 18px;font-family:Arial,sans-serif}
.serp .u{color:#202124;font-size:.82rem}
.serp .t{color:#1a0dab;font-size:1.25rem;line-height:1.3;margin:2px 0 3px}
.serp .d{color:#4d5156;font-size:.88rem;line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3038D8;background:#fff;border:1px solid rgba(24,28,79,.14);padding:6px 14px;border-radius:999px}
.note{font-size:.84rem;color:rgba(24,28,79,.62);margin-top:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


body{background:transparent;padding:0}
.wrap{max-width:100%;padding:0}
.card{box-shadow:none;margin:0}
.credit{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:14px;font-size:.82rem;color:rgba(24,28,79,.62)}
</style>

<body>
<main class="wrap">
  <p style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:.82rem;color:rgba(24,28,79,.7)"><label for="cur" style="margin:0;font-weight:700;font-size:.82rem">Currency</label><select id="cur" data-cur-switch aria-label="Currency" style="width:auto;padding:6px 9px;background:#fff;font-size:.82rem"></select></p>
  <div class="card">

    <div class="row"><div class="field"><label for="budget">Budget for the period (₹)</label><input id="budget" type="number" inputmode="decimal" step="any" min="0" value="300000"></div><div class="field"><label for="spent">Spent so far (₹)</label><input id="spent" type="number" inputmode="decimal" step="any" min="0" value="96000"></div><div class="field"><label for="days">Days in the period</label><input id="days" type="number" inputmode="decimal" step="1" min="1" value="30"></div><div class="field"><label for="elapsed">Days elapsed</label><input id="elapsed" type="number" inputmode="decimal" step="1" min="0" value="14"></div><div class="field"><label for="cpa">Current cost per result (₹)</label><input id="cpa" type="number" inputmode="decimal" step="any" min="0" value="480"><p class="hint">Leave at zero if you only want the pacing figures.</p></div><div class="field"><label for="target">Target cost per result (₹)</label><input id="target" type="number" inputmode="decimal" step="any" min="0" value="450"></div></div>
    <div class="out">
      <div class="row"><div class="metric"><div class="k">Pacing</div><div class="v" id="o_pace">—</div><div class="s" id="o_pace-s"></div></div><div class="metric"><div class="k">Should have spent by now</div><div class="v" id="o_should">—</div><div class="s" id="o_should-s"></div></div><div class="metric"><div class="k">Ahead / behind</div><div class="v" id="o_gap">—</div><div class="s" id="o_gap-s"></div></div></div><div class="row" style="margin-top:18px"><div class="metric"><div class="k">Daily spend needed</div><div class="v" id="o_daily">—</div><div class="s" id="o_daily-s">for the rest</div></div><div class="metric"><div class="k">Projected spend</div><div class="v" id="o_proj">—</div><div class="s" id="o_proj-s">at current rate</div></div><div class="metric"><div class="k">Projected results</div><div class="v" id="o_results">—</div><div class="s" id="o_results-s"></div></div></div><div id="o_verdict" class="verdict"></div>
    </div>
  </div>
  <p class="credit">
    <span><a href="https://mediapuppies.com/tools/budget-pacing-calculator/" target="_blank" rel="noopener">Budget pacing calculator</a> by
    <a href="https://mediapuppies.com/" target="_blank" rel="noopener"><strong>Media Puppies</strong></a></span>
    <a href="https://mediapuppies.com/tools/" target="_blank" rel="noopener">More free tools →</a>
  </p>
</main>
<script>
var MP_SLUG='budget-pacing-calculator';
function calc(){
  var b=+v('budget')||0, sp=+v('spent')||0, d=Math.max(1,+v('days')||1),
      e=+v('elapsed')||0, cpa=+v('cpa')||0, tg=+v('target')||0;
  var ids=['o_pace','o_should','o_gap','o_daily','o_proj','o_results'];
  var el=document.getElementById('o_verdict');
  if(b<=0){ids.forEach(function(i){set(i,'\u2014');});
    el.className='verdict warn'; el.textContent='Enter a budget.'; return;}
  e=Math.min(e,d);
  var should=b*(e/d), left=b-sp, daysLeft=d-e;
  var pace = should>0 ? sp/should : 0;
  var perDay = daysLeft>0 ? left/daysLeft : 0;
  var run = e>0 ? sp/e : 0;
  var proj = run*d;
  set('o_pace', should>0 ? (pace*100).toFixed(0)+'%' : '\u2014');
  document.getElementById('o_pace-s').textContent='100% is exactly on plan';
  set('o_should',MP.fmt(should));
  set('o_gap',MP.fmt(sp-should));
  document.getElementById('o_gap-s').textContent = sp>=should ? 'ahead of plan' : 'behind plan';
  set('o_daily', daysLeft>0 ? MP.fmt(perDay) : '\u2014');
  document.getElementById('o_daily-s').textContent = daysLeft>0 ? 'over '+daysLeft+' days' : 'period finished';
  set('o_proj',MP.fmt(proj));
  set('o_results', cpa>0 ? Math.floor(b/cpa).toLocaleString() : '\u2014');
  document.getElementById('o_results-s').textContent = cpa>0 ? 'if the full budget is spent' : 'add a cost per result';
  var msgs=[];
  if(daysLeft<=0) msgs.push('The period is over. You spent '+MP.fmt(sp)+' of '+MP.fmt(b)+'.');
  else if(pace<0.85){
    var jump = run>0 ? perDay/run : 0;
    msgs.push('Under-pacing at '+(pace*100).toFixed(0)+'%. To use the budget you need '+MP.fmt(perDay)+' a day for the remaining '+daysLeft+' \u2014 that is '+jump.toFixed(1)+'x your current rate. Raise budgets in steps of about 20%, not in one jump, or you will reset the learning phase and lose days.');
  }
  else if(pace>1.15) msgs.push('Over-pacing at '+(pace*100).toFixed(0)+'%. At this rate you finish the budget on day '+Math.floor(b/run)+' of '+d+', then go dark for '+(d-Math.floor(b/run))+' days. Cutting daily budget now is better than stopping later.');
  else msgs.push('On track at '+(pace*100).toFixed(0)+'% of plan. Keep daily spend near '+MP.fmt(perDay)+'.');
  if(cpa>0&&tg>0){
    if(cpa>tg*1.15) msgs.push('Cost per result is '+MP.fmt(cpa)+' against a '+MP.fmt(tg)+' target, so spending the full budget buys fewer results than planned. Fix efficiency before chasing the spend number.');
    else if(cpa<tg*0.85) msgs.push('Cost per result is under target at '+MP.fmt(cpa)+' \u2014 this is the case for spending more, not less.');
  }
  el.className='verdict '+((pace<0.85||pace>1.15)?'warn':'good');
  el.textContent=msgs.join(' ');
}

function v(id){var e=document.getElementById(id);return e?e.value:'';}
function set(id,val){var e=document.getElementById(id);if(e)e.textContent=val;}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('input,select,textarea').forEach(function(el){
    el.addEventListener('input',calc); el.addEventListener('change',calc);
  });
  calc();
  if(window.mpTrack)window.mpTrack('ViewContent',{content_category:'tool',content_name:document.title});
});
window.calc=calc;

/* Tell the host page how tall we are, so a fixed iframe height is only a
   fallback. Height depends on the host's column width, which we cannot guess. */
(function(){
  var last=0;
  function post(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>4){ last=h;
      try{ parent.postMessage({mpHeight:h, mpSlug:MP_SLUG}, '*'); }catch(e){}
    }
  }
  addEventListener('load',post); addEventListener('resize',post);
  document.addEventListener('input',function(){setTimeout(post,60);});
  document.addEventListener('change',function(){setTimeout(post,60);});
  setInterval(post,1000);
})();
</script>
</body>
