<body>
<main class="wrap">
  <p style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:.82rem;color:rgba(24,28,79,.7)"><label for="cur" style="margin:0;font-weight:700;font-size:.82rem">Currency</label><select id="cur" data-cur-switch aria-label="Currency" style="width:auto;padding:6px 9px;background:#fff;font-size:.82rem"></select></p>
  <div class="card">

    <div class="row"><div class="field"><label for="price">Average order value (₹)</label><input id="price" type="number" inputmode="decimal" step="any" min="0" value="1500"></div><div class="field"><label for="cogs">Cost of goods per order (₹)</label><input id="cogs" type="number" inputmode="decimal" step="any" min="0" value="600"></div><div class="field"><label for="ship">Forward shipping per order (₹)</label><input id="ship" type="number" inputmode="decimal" step="any" min="0" value="80"></div><div class="field"><label for="codfee">COD collection fee (₹)</label><input id="codfee" type="number" inputmode="decimal" step="any" min="0" value="25"><p class="hint">A flat courier charge, typically ₹20–40.</p></div><div class="field"><label for="rtocod">RTO rate on COD (%)</label><input id="rtocod" type="number" inputmode="decimal" step="any" min="0" value="28"><p class="hint">Ask your courier for your own figure.</p></div><div class="field"><label for="rtopre">RTO rate on prepaid (%)</label><input id="rtopre" type="number" inputmode="decimal" step="any" min="0" value="4"></div><div class="field"><label for="splitcod">Share of orders that are COD (%)</label><input id="splitcod" type="number" inputmode="decimal" step="any" min="0" value="65"></div><div class="field"><label for="disc">Prepaid discount you would offer (%)</label><input id="disc" type="number" inputmode="decimal" step="any" min="0" value="5"></div><div class="field"><label for="shift">COD buyers who would switch (%)</label><input id="shift" type="number" inputmode="decimal" step="any" min="0" value="30"></div></div>
    <div class="out">
      <div class="row"><div class="metric"><div class="k">Profit per COD order</div><div class="v" id="o_cod">—</div><div class="s" id="o_cod-s"></div></div><div class="metric"><div class="k">Profit per prepaid order</div><div class="v" id="o_pre">—</div><div class="s" id="o_pre-s"></div></div><div class="metric"><div class="k">Gap per order</div><div class="v" id="o_gap">—</div><div class="s" id="o_gap-s"></div></div></div><div class="row" style="margin-top:18px"><div class="metric"><div class="k">Profit now</div><div class="v" id="o_now">—</div><div class="s" id="o_now-s">per 100 orders</div></div><div class="metric"><div class="k">With the prepaid push</div><div class="v" id="o_after">—</div><div class="s" id="o_after-s">per 100 orders</div></div><div class="metric"><div class="k">Difference</div><div class="v" id="o_delta">—</div><div class="s" id="o_delta-s"></div></div></div><div id="o_verdict" class="verdict"></div>
    </div>
  </div>
  <p class="credit">
    <span><a href="https://mediapuppies.com/tools/cod-vs-prepaid-calculator/" target="_blank" rel="noopener">COD vs prepaid profit calculator</a> by
    <a href="https://mediapuppies.com/" target="_blank" rel="noopener"><strong>Media Puppies</strong></a></span>
    <a href="https://mediapuppies.com/tools/" target="_blank" rel="noopener">More free tools →</a>
  </p>
</main>
<script>
var MP_SLUG='cod-vs-prepaid-calculator';
function calc(){
  var p=+v('price')||0,c=+v('cogs')||0,sh=+v('ship')||0,cf=+v('codfee')||0,
      rc=(+v('rtocod')||0)/100,rp=(+v('rtopre')||0)/100,
      sc=(+v('splitcod')||0)/100,di=(+v('disc')||0)/100,mv=(+v('shift')||0)/100;
  var ids=['o_cod','o_pre','o_gap','o_now','o_after','o_delta'];
  var el=document.getElementById('o_verdict');
  if(p<=0){ids.forEach(function(i){set(i,'\u2014');});
    el.className='verdict warn'; el.textContent='Enter an average order value.'; return;}
  /* An RTO earns nothing and pays shipping twice. */
  var codDeliv=p-c-sh-cf, rto=-(sh*2);
  var cod=(1-rc)*codDeliv+rc*rto;
  var pp=p*(1-di), preDeliv=pp-c-sh;
  var pre=(1-rp)*preDeliv+rp*rto;
  set('o_cod',MP.fmt(cod)); set('o_pre',MP.fmt(pre)); set('o_gap',MP.fmt(pre-cod));
  document.getElementById('o_cod-s').textContent=(cod/p*100).toFixed(1)+'% of order value';
  document.getElementById('o_pre-s').textContent=(pre/(pp||1)*100).toFixed(1)+'% of discounted value';
  var now=100*(sc*cod+(1-sc)*pre), sc2=sc*(1-mv), after=100*(sc2*cod+(1-sc2)*pre);
  set('o_now',MP.fmt(now)); set('o_after',MP.fmt(after)); set('o_delta',MP.fmt(after-now));
  if(cod<0){el.className='verdict bad';
    el.textContent='Every COD order loses '+MP.fmt(-cod)+'. At '+(rc*100).toFixed(0)+'% RTO the returns eat the margin on the ones that do deliver. Pushing prepaid is not an optimisation, it is the fix.';}
  else if(pre-cod>p*0.08){el.className='verdict good';
    el.textContent='A prepaid order is worth '+MP.fmt(pre-cod)+' more than a COD one even after a '+(di*100).toFixed(0)+'% discount. Moving '+(mv*100).toFixed(0)+'% of COD buyers across adds '+MP.fmt(after-now)+' per 100 orders.';}
  else {el.className='verdict warn';
    el.textContent='The gap is only '+MP.fmt(pre-cod)+' per order, so a '+(di*100).toFixed(0)+'% discount gives away most of the benefit. Try a smaller discount, or cut RTO with address verification instead.';}
}

function v(id){var e=document.getElementById(id);return e?e.value:'';}
function set(id,val){var e=document.getElementById(id);if(e)e.textContent=val;}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('input,select,textarea').forEach(function(el){
    el.addEventListener('input',calc); el.addEventListener('change',calc);
  });
  calc();
  if(window.mpTrack)window.mpTrack('ViewContent',{content_category:'tool',content_name:document.title});
});

window.calc=calc;

/* Tell the host page how tall we are, so a fixed iframe height is only a
   fallback. Height depends on the host's column width, which we cannot guess. */
(function(){
  var last=0;
  function post(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>4){ last=h;
      try{ parent.postMessage({mpHeight:h, mpSlug:MP_SLUG}, '*'); }catch(e){}
    }
  }
  addEventListener('load',post); addEventListener('resize',post);
  document.addEventListener('input',function(){setTimeout(post,60);});
  document.addEventListener('change',function(){setTimeout(post,60);});
  setInterval(post,1000);
})();
</script>
