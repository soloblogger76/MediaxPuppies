<body>
<main class="wrap">
  <p style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:.82rem;color:rgba(24,28,79,.7)"><label for="cur" style="margin:0;font-weight:700;font-size:.82rem">Currency</label><select id="cur" data-cur-switch aria-label="Currency" style="width:auto;padding:6px 9px;background:#fff;font-size:.82rem"></select></p>
  <div class="card">

    <div class="row"><div><div class="field"><label for="na">Variant A — visitors</label><input id="na" type="number" inputmode="decimal" step="1" min="0" value="1200"></div><div class="field"><label for="ca">Variant A — conversions</label><input id="ca" type="number" inputmode="decimal" step="1" min="0" value="48"></div></div><div><div class="field"><label for="nb">Variant B — visitors</label><input id="nb" type="number" inputmode="decimal" step="1" min="0" value="1180"></div><div class="field"><label for="cb">Variant B — conversions</label><input id="cb" type="number" inputmode="decimal" step="1" min="0" value="67"></div></div></div>
    <div class="out">
      <div class="row"><div class="metric"><div class="k">Variant A rate</div><div class="v" id="o_ra">—</div><div class="s" id="o_ra-s"></div></div><div class="metric"><div class="k">Variant B rate</div><div class="v" id="o_rb">—</div><div class="s" id="o_rb-s"></div></div><div class="metric"><div class="k">Relative lift</div><div class="v" id="o_lift">—</div><div class="s" id="o_lift-s"></div></div></div><div class="row" style="margin-top:18px"><div class="metric"><div class="k">Confidence</div><div class="v" id="o_conf">—</div><div class="s" id="o_conf-s"></div></div><div class="metric"><div class="k">p-value</div><div class="v" id="o_p">—</div><div class="s" id="o_p-s"></div></div><div class="metric"><div class="k">z-score</div><div class="v" id="o_z">—</div><div class="s" id="o_z-s"></div></div></div><div id="o_verdict" class="verdict"></div>
    </div>
  </div>
  <p class="credit">
    <span><a href="https://mediapuppies.com/tools/ab-test-significance-calculator/" target="_blank" rel="noopener">A/B test significance calculator</a> by
    <a href="https://mediapuppies.com/" target="_blank" rel="noopener"><strong>Media Puppies</strong></a></span>
    <a href="https://mediapuppies.com/tools/" target="_blank" rel="noopener">More free tools →</a>
  </p>
</main>
<script>
var MP_SLUG='ab-test-significance-calculator';

/* Abramowitz & Stegun 7.1.26 \u2014 accurate to ~1.5e-7, plenty for this. */
function erf(x){var s=x<0?-1:1;x=Math.abs(x);
  var a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  var t=1/(1+p*x), y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return s*y;}
function phi(z){return .5*(1+erf(z/Math.SQRT2));}
function calc(){
  var na=+v('na')||0, ca=+v('ca')||0, nb=+v('nb')||0, cb=+v('cb')||0;
  var el=document.getElementById('o_verdict');
  var ids=['o_ra','o_rb','o_lift','o_conf','o_p','o_z'];
  if(na<=0||nb<=0){ids.forEach(function(i){set(i,'\u2014');});
    el.className='verdict warn';el.textContent='Enter visitor counts for both variants.';return;}
  if(ca>na||cb>nb){ids.forEach(function(i){set(i,'\u2014');});
    el.className='verdict bad';el.textContent='Conversions cannot exceed visitors.';return;}
  var pa=ca/na, pb=cb/nb;
  set('o_ra',(pa*100).toFixed(2)+'%'); set('o_rb',(pb*100).toFixed(2)+'%');
  var lift = pa>0 ? (pb-pa)/pa*100 : 0;
  set('o_lift',(lift>=0?'+':'')+lift.toFixed(1)+'%');
  var pool=(ca+cb)/(na+nb);
  var se=Math.sqrt(pool*(1-pool)*(1/na+1/nb));
  if(se===0){set('o_conf','\u2014');set('o_p','\u2014');set('o_z','\u2014');
    el.className='verdict warn';el.textContent='No conversions recorded yet.';return;}
  var z=(pb-pa)/se, p=2*(1-phi(Math.abs(z))), conf=(1-p)*100;
  set('o_z',z.toFixed(2));
  set('o_p',p<0.0001?'<0.0001':p.toFixed(4));
  set('o_conf',conf.toFixed(1)+'%');
  var winner = pb>pa?'B':'A';
  if(p<0.05){el.className='verdict good';
    el.textContent='Significant at 95%. Variant '+winner+' is ahead and the gap is unlikely to be chance (p = '+(p<0.0001?'<0.0001':p.toFixed(4))+'). You can ship it \u2014 but check the test ran at least one full week to cover the weekly cycle.';}
  else if(p<0.2){el.className='verdict warn';
    el.textContent='Not significant yet, but trending. At '+conf.toFixed(0)+'% confidence there is a real chance this is noise. Keep it running rather than calling it.';}
  else {el.className='verdict bad';
    el.textContent='No meaningful difference. At '+conf.toFixed(0)+'% confidence these two variants are behaving the same. Either the change was too small to matter, or you need far more traffic. Test a bigger difference.';}
}
function v(id){var e=document.getElementById(id);return e?e.value:'';}
function set(id,val){var e=document.getElementById(id);if(e)e.textContent=val;}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('input,select,textarea').forEach(function(el){
    el.addEventListener('input',calc); el.addEventListener('change',calc);
  });
  calc();
  if(window.mpTrack)window.mpTrack('ViewContent',{content_category:'tool',content_name:document.title});
});

window.calc=calc;

/* Tell the host page how tall we are, so a fixed iframe height is only a
   fallback. Height depends on the host's column width, which we cannot guess. */
(function(){
  var last=0;
  function post(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>4){ last=h;
      try{ parent.postMessage({mpHeight:h, mpSlug:MP_SLUG}, '*'); }catch(e){}
    }
  }
  addEventListener('load',post); addEventListener('resize',post);
  document.addEventListener('input',function(){setTimeout(post,60);});
  document.addEventListener('change',function(){setTimeout(post,60);});
  setInterval(post,1000);
})();
</script>
</body>
