<main class="wrap" data-inr-only>

    <div class="field"><label for="n_val">Enter a number, or a phrase like “2.5 crore”</label><input id="n_val" type="text" value="14750000" placeholder="e.g. 4500000 or 45 lakh"></div><p class="hint">Accepts digits, commas, ₹, and the words lakh, lac, crore, cr, k, million or billion.</p>
    <div class="out">
      <div class="row"><div class="metric"><div class="k">Indian format</div><div class="v" id="o_indian">—</div><div class="s" id="o_indian-s"></div></div><div class="metric"><div class="k">In words</div><div class="v" id="o_words">—</div><div class="s" id="o_words-s"></div></div></div><div class="row" style="margin-top:18px"><div class="metric"><div class="k">Lakh</div><div class="v" id="o_lakh">—</div><div class="s" id="o_lakh-s"></div></div><div class="metric"><div class="k">Crore</div><div class="v" id="o_crore">—</div><div class="s" id="o_crore-s"></div></div><div class="metric"><div class="k">International</div><div class="v" id="o_intl">—</div><div class="s" id="o_intl-s"></div></div></div><div id="o_verdict" class="verdict"></div>

<script>
var MP_SLUG='lakh-crore-converter';

function parseIn(raw){
  var s=(raw||'').toString().toLowerCase().replace(/[\u20b9,\s]/g,'').trim();
  if(!s) return null;
  var m=s.match(/^(-?[0-9]*\.?[0-9]+)(.*)$/);
  if(!m) return null;
  var n=parseFloat(m[1]); if(isNaN(n)) return null;
  var unit=m[2];
  if(/^(cr|crore|crores)$/.test(unit)) n*=1e7;
  else if(/^(l|lac|lakh|lakhs|lacs)$/.test(unit)) n*=1e5;
  else if(/^(k|thousand)$/.test(unit)) n*=1e3;
  else if(/^(m|mn|million)$/.test(unit)) n*=1e6;
  else if(/^(b|bn|billion)$/.test(unit)) n*=1e9;
  else if(unit) return null;
  return n;
}
function indianGroup(n){
  var neg=n<0; n=Math.abs(n);
  var p=n.toFixed(Math.abs(n)<1&&n!==0?2:(n%1?2:0)).split('.');
  var i=p[0], last=i.slice(-3), rest=i.slice(0,-3);
  if(rest) rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
  var out=(rest?rest+',':'')+last;
  return (neg?'-':'')+out+(p[1]?'.'+p[1]:'');
}
var ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve',
 'thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function twoDigit(n){ if(n<20) return ONES[n];
  return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''); }
function threeDigit(n){ var out=[];
  if(n>99){out.push(ONES[Math.floor(n/100)]+' hundred'); n%=100;}
  if(n) out.push(twoDigit(n));
  return out.join(' and '); }
function words(n){
  if(n===0) return 'zero';
  var neg=n<0; n=Math.abs(Math.round(n));
  if(n>=1e15) return 'too large';
  var parts=[];
  var cr=Math.floor(n/1e7); n%=1e7;
  var lk=Math.floor(n/1e5);  n%=1e5;
  var th=Math.floor(n/1e3);  n%=1e3;
  if(cr) parts.push((cr>=100?words(cr):threeDigit(cr))+' crore');
  if(lk) parts.push(threeDigit(lk)+' lakh');
  if(th) parts.push(threeDigit(th)+' thousand');
  if(n)  parts.push(threeDigit(n));
  return (neg?'minus ':'')+parts.join(' ');
}
function trim(x){ return (Math.round(x*100)/100).toLocaleString('en-IN'); }
function calc(){
  var n=parseIn(v('n_val'));
  var el=document.getElementById('o_verdict');
  var ids=['o_indian','o_words','o_lakh','o_crore','o_intl'];
  if(n===null){ids.forEach(function(i){set(i,'\u2014');});
    el.className='verdict warn';
    el.textContent='Enter a number, or something like \u201c2.5 crore\u201d or \u201c45 lakh\u201d.';return;}
  set('o_indian','\u20b9'+indianGroup(n));
  set('o_words',words(n));
  set('o_lakh',trim(n/1e5)+' L');
  set('o_crore',trim(n/1e7)+' Cr');
  set('o_intl',Math.abs(n)>=1e9?trim(n/1e9)+' billion':Math.abs(n)>=1e6?trim(n/1e6)+' million':Math.abs(n)>=1e3?trim(n/1e3)+'k':trim(n));
  el.className='verdict good';
  el.textContent='Indian grouping puts commas after the first three digits and every two digits after that \u2014 which is why 10,00,000 and 1,000,000 are the same number written two ways.';
}
function v(id){var e=document.getElementById(id);return e?e.value:'';}
function set(id,val){var e=document.getElementById(id);if(e)e.textContent=val;}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('input,select,textarea').forEach(function(el){
    el.addEventListener('input',calc); el.addEventListener('change',calc);
  });
  calc();
  if(window.mpTrack)window.mpTrack('ViewContent',{content_category:'tool',content_name:document.title});
});

/* Tell the host page how tall we are, so a fixed iframe height is only a
   fallback. Height depends on the host's column width, which we cannot guess. */
(function(){
  var last=0;
  function post(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>4){ last=h;
      try{ parent.postMessage({mpHeight:h, mpSlug:MP_SLUG}, '*'); }catch(e){}
    }
  }
  addEventListener('load',post); addEventListener('resize',post);
  document.addEventListener('input',function(){setTimeout(post,60);});
  document.addEventListener('change',function(){setTimeout(post,60);});
  setInterval(post,1000);
})();
</script>
