<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@500,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2256px;height:382px;overflow:hidden}
body{background:#F6F5EF;font-family:'Satoshi',system-ui,sans-serif;position:relative}
.bg{position:absolute;inset:0;background:
  radial-gradient(900px 500px at 88% 20%, rgba(48,56,216,.13), transparent 62%),
  radial-gradient(700px 460px at 6% 95%, rgba(255,172,28,.20), transparent 60%)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 120px}
.left{max-width:1180px;padding-left:430px}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font-size:22px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:#3038D8;margin-bottom:24px}
.dot{width:12px;height:12px;border-radius:50%;background:#FFAC1C}
h1{font-family:'Clash Display',sans-serif;font-weight:700;font-size:74px;line-height:1.02;letter-spacing:-.025em;color:#181C4F}
h1 span{color:#3038D8}
p{margin-top:20px;font-size:27px;color:rgba(24,28,79,.62);font-weight:500}
.right{display:flex;flex-direction:column;gap:18px;flex:none}
.stat{background:#fff;border:2px solid rgba(24,28,79,.10);border-radius:24px;padding:20px 34px;box-shadow:0 18px 44px rgba(24,28,79,.10);min-width:300px}
.n{font-family:'Clash Display',sans-serif;font-weight:700;font-size:42px;line-height:1;letter-spacing:-.02em;color:#3038D8}
.l{font-size:17px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:rgba(24,28,79,.64);margin-top:7px}
</style></head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="left">
    <div class="eyebrow"><span class="dot"></span>Performance Marketing · Delhi NCR</div>
    <h1>We buy customers.<br><span>Profitably.</span></h1>
    <p>Meta &amp; Google · SEO · Influencer · AI Automation</p>
  </div>
  <div class="right">
    <div class="stat"><div class="n">$10M+</div><div class="l">Ad spend managed</div></div>
    <div class="stat"><div class="n">150+ clients · 8 yrs</div><div class="l">Zero account bans</div></div>
  </div>
</div>
</body></html>
