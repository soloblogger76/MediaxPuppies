<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" role="img" aria-label="Share mentioning financing, roofing companies against lead and cost sites"><rect width="1000" height="424" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">Ads that mention financing</text><text x="48" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Lead and cost sites</text><rect x="48" y="170" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="170" width="290" height="34" rx="10" fill="#FFAC1C"/><text x="952" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">38.5%</text><text x="48" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Roofing companies</text><rect x="48" y="262" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="262" width="86" height="34" rx="10" fill="#3038D8"/><text x="952" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">11.5%</text><text x="48" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4A4E7A" text-anchor="start">Source: Media Puppies, Meta Ad Library, US, 52 roofers and 13 lead and cost sites.</text><text x="952" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
