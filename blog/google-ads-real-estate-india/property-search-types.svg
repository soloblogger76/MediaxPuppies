<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 756" role="img" aria-label="Three kinds of property search on Google: project name, locality and generic"><rect width="1000" height="756" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">Three kinds of property search</text><rect x="48" y="130" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="130" width="16" height="170" rx="8" fill="#1F8A3B"/><text x="92" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Project and builder name</text><text x="92" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Highest intent, smallest volume</text><text x="92" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Protect it; rivals bid on it too</text><rect x="48" y="322" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="322" width="16" height="170" rx="8" fill="#3038D8"/><text x="92" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Locality and configuration</text><text x="92" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">&quot;3 BHK in Sector 150 Noida&quot;</text><text x="92" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Most of the qualified volume</text><rect x="48" y="514" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="514" width="16" height="