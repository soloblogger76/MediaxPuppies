<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 948" role="img" aria-label="Four kinds of plumbing search intent: emergency, repair, install and commercial"><rect width="1000" height="948" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">Four kinds of plumbing search</text><rect x="48" y="130" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="130" width="16" height="170" rx="8" fill="#B23B3B"/><text x="92" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Emergency</text><text x="92" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Burst pipe, no water, sewer backup</text><text x="92" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Calls only, staffed hours, fast answer</text><rect x="48" y="322" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="322" width="16" height="170" rx="8" fill="#3038D8"/><text x="92" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Repair</text><text x="92" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Leaks, clogs, running toilets</text><text x="92" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Calls and short forms, same or next day</text><rect x="48" y="514" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="514" width="16" height="170" rx="8" fill="#1F8A3B"/><text x="92" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Install and replace</text><text x="92" y="614" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Water heaters, repiping, fixtures</text><text x="92" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Estimates, higher value, longer research</text><rect x="48" y="706" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="706" width="16" height="170" rx="8" fill="#FFAC1C"/><text x="92" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Commercial</text><text x="92" y="806" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Restaurants, offices, property managers</text><text x="92" y="848" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Accounts and contracts, separate pages</text><text x="952" y="918" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
