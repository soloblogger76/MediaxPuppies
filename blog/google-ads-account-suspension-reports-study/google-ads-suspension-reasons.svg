<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 976" role="img" aria-label="Reasons Google gave in 162 first-hand reports of a suspended Google Ads account"><rect width="1000" height="976" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">The reason Google gave (162 reports)</text><text x="48" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Misrepresentation</text><rect x="48" y="170" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="170" width="754" height="34" rx="10" fill="#FFAC1C"/><text x="952" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">45 of 162</text><text x="48" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Writer did not say</text><rect x="48" y="262" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="262" width="737" height="34" rx="10" fill="#3038D8"/><text x="952" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">44 of 162</text><text x="48" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Circumventing systems</text><rect x="48" y="354" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="354" width="284" height="34" rx="10" fill="#3038D8"/><text x="952" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">17 of 162</text><text x="48" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">No reason given</text><rect x="48" y="446" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="446" width="284" height="34" rx="10" fill="#3038D8"/><text x="952" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">17 of 162</text><text x="48" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Landing page or site policy</text><rect x="48" y="538" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="538" width="168" height="34" rx="10" fill="#3038D8"/><text x="952" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">10 of 162</text><text x="48" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Another named policy</text><rect x="48" y="630" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="630" width="168" height="34" rx="10" fill="#3038D8"/><text x="952" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">10 of 162</text><text x="48" y="708" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Suspicious payments</text><rect x="48" y="722" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="722" width="151" height="34" rx="10" fill="#3038D8"/><text x="952" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">9 of 162</text><text x="48" y="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Malware or phishing</text><rect x="48" y="814" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="814" width="84" height="34" rx="10" fill="#3038D8"/><text x="952" y="842" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">5 of 162</text><text x="48" y="896" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4A4E7A" text-anchor="start">Self-reported. 4 smaller reasons not shown. Source: Media Puppies.</text><text x="952" y="946" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
