<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 792" role="img" aria-label="What 98 advertisers believed caused their Meta restriction, from no idea to a hacked account"><rect width="1000" height="792" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">What advertisers blamed (98 reports)</text><text x="48" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">No idea</text><rect x="48" y="170" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="170" width="754" height="34" rx="10" fill="#FFAC1C"/><text x="952" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">32 of 98</text><text x="48" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Brand new account</text><rect x="48" y="262" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="262" width="470" height="34" rx="10" fill="#3038D8"/><text x="952" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">20 of 98</text><text x="48" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Something in the ad or page</text><rect x="48" y="354" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="354" width="329" height="34" rx="10" fill="#3038D8"/><text x="952" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">14 of 98</text><text x="48" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Account was hacked</text><rect x="48" y="446" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="446" width="212" height="34" rx="10" fill="#3038D8"/><text x="952" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">9 of 98</text><text x="48" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Dormant or never advertised</text><rect x="48" y="538" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="538" width="163" height="34" rx="10" fill="#3038D8"/><text x="952" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">7 of 98</text><text x="48" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">A failed or changed payment</text><rect x="48" y="630" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="630" width="94" height="34" rx="10" fill="#3038D8"/><text x="952" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">4 of 98</text><text x="48" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4A4E7A" text-anchor="start">Self-reported. Source: Media Puppies.</text><text x="952" y="762" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
