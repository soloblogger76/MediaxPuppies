<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Instant form questions that filter real estate leads, and ones to avoid"><rect width="1000" height="640" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">Instant form questions</text><rect x="48" y="120" width="440" height="440" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="120" width="440" height="64" rx="22" fill="#1F8A3B"/><rect x="48" y="160" width="440" height="24" fill="#1F8A3B"/><text x="76" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Ask</text><text x="76" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Configuration wanted</text><text x="76" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Purchase timeline</text><text x="76" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Own use or investment</text><text x="76" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Preferred visit day</text><text x="76" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Budget band (ranges)</text><rect x="512" y="120" width="440" height="440" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="512" y="120" width="440" height="64" rx="22" fill="#B23B3B"/><rect x="512" y="160" width="440" height="24" fill="#B23B3B"/><text x="540" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Avoid</text><text x="540" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Long free-text fields</text><text x="540" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Email as compulsory</text><text x="540" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Five or more questions</text><text x="540" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Questions on health</text><text x="540" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Prefilled yes answers</text><text x="952" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
