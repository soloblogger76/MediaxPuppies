<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-label="Five steps from a med spa ad to a treatment"><rect width="1000" height="920" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">From ad to treatment</text><rect x="48" y="130" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="190" r="34" fill="#3038D8"/><text x="112" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="172" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#181C4F" text-anchor="start">Ad click or call</text><text x="172" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4A4E7A" text-anchor="start">Tracked by campaign and treatment</text><path d="M112 250 v24" stroke="#3038D8" stroke-width="4"/><rect x="48" y="280" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="340" r="34" fill="#3038D8"/><text x="112" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="172" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#181C4F" text-anchor="start">Consult booked online</text><text x="172" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4A4E7A" text-anchor="start">Real-time calendar, deposit if used</text><path d="M112 400 v24" stroke="#3038D8" stroke-width="4"/><rect x="48" y="430" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="490" r="34" fill="#3038D8"/><text x="112" y="50