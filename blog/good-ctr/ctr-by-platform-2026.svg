<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 792" role="img" aria-label="Typical click-through rate by ad platform in 2026"><rect width="1000" height="792" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">Typical CTR by platform, 2026</text><text x="48" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Google search</text><rect x="48" y="170" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="170" width="50" height="34" rx="10" fill="#FFAC1C"/><text x="952" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">6.64%</text><text x="48" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Facebook, lead campaigns</text><rect x="48" y="262" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="262" width="20" height="34" rx="10" fill="#3038D8"/><text x="952" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">2.70%</text><text x="48" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Facebook, traffic campaigns</text><rect x="48" y="354" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="354" width="14" height="34" rx="10" fill="#3038D8"/><text x="952" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">1.93%</text><text x="48" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">LinkedIn Sponsored Content</text><rect x="48" y="446" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="446" width="6" height="34" rx="10" fill="#3038D8"/><text x="952" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">about 0.5%</text><text x="48" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Display, by industry</text><rect x="48" y="538" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="538" width="6" height="34" rx="10" fill="#3038D8"/><text x="952" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">0.12% to 0.40%</text><text x="48" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Video display ads</text><rect x="48" y="630" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="630" width="6" height="34" rx="10" fill="#3038D8"/><text x="952" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">0.09%</text><text x="48" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4A4E7A" text-anchor="start">Sources: WordStream/LocalIQ 2026; James Green.</text><text x="952" y="762" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
