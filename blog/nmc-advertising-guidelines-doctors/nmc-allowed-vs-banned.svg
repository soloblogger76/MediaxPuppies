<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="What the NMC guidelines allow and ban in medical advertising"><rect width="1000" height="640" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">NMC 2026: allowed and banned</text><rect x="48" y="120" width="440" height="440" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="120" width="440" height="64" rx="22" fill="#1F8A3B"/><rect x="48" y="160" width="440" height="24" fill="#1F8A3B"/><text x="76" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Allowed (factual)</text><text x="76" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Clinic name, address</text><text x="76" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Departments, services</text><text x="76" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Fees, if not misleading</text><text x="76" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Practice announcements</text><text x="76" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Educational talks</text><rect x="512" y="120" width="440" height="440" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="512" y="120" width="440" height="64" rx="22" fill="#B23B3B"/><rect x="512" y="160" width="440" height="24" fill="#B23B3B"/><text x="540" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Banned</text><text x="540" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Before/after photos</text><text x="540" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Patient testimonials</text><text x="540" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Cure or success claims</text><text x="540" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Discounts, freebies</text><text x="540" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✕ Fee per referred patient</text><text x="952" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
