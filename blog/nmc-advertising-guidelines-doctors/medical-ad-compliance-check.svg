<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1070" role="img" aria-label="Six checks to run before a medical ad goes live"><rect width="1000" height="1070" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">Before a medical ad goes live</text><rect x="48" y="130" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="190" r="34" fill="#3038D8"/><text x="112" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="172" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#181C4F" text-anchor="start">Who is advertising?</text><text x="172" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4A4E7A" text-anchor="start">A doctor, a hospital or a platform</text><path d="M112 250 v24" stroke="#3038D8" stroke-width="4"/><rect x="48" y="280" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="340" r="34" fill="#3038D8"/><text x="112" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="172" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#181C4F" text-anchor="start">Remove claims</text><text x="172" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4A4E7A" text-anchor="start">No cures, success rates or &quot;best&quot;</text><path d="M112 400 v24" stroke="#3038D8" stroke-width="4"/><rect x="48" y="430" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="490" r="34" fill="#3038D8"/><text x="112" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="172" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#181C4F" text-anchor="start">Check every image</text><text x="172" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4A4E7A" text-anchor="start">No before/after, no promo doctor photos</text><path d="M112 550 v24" stroke="#3038D8" stroke-width="4"/><rect x="48" y="580" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="640" r="34" fill="#3038D8"/><text x="112" y="652" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="172" y="632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#181C4F" text-anchor="start">Check offers</text><text x="172" y="674" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4A4E7A" text-anchor="start">No discounts that push tests or treatment</text><path d="M112 700 v24" stroke="#3038D8" stroke-width="4"/><rect x="48" y="730" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="790" r="34" fill="#3038D8"/><text x="112" y="802" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="172" y="782" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#181C4F" text-anchor="start">Check payment terms</text><text x="172" y="824" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4A4E7A" text-anchor="start">No fee tied to each patient referred</text><path d="M112 850 v24" stroke="#3038D8" stroke-width="4"/><rect x="48" y="880" width="904" height="120" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><circle cx="112" cy="940" r="34" fill="#FFAC1C"/><text x="112" y="952" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="middle">6</text><text x="172" y="932" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#181C4F" text-anchor="start">Label AI content</text><text x="172" y="974" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4A4E7A" text-anchor="start">Mark it; no synthetic endorsements</text><text x="952" y="1040" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
