<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 756" role="img" aria-label="Three kinds of roofing demand: storm, replacement and repair"><rect width="1000" height="756" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">Three kinds of roofing demand</text><rect x="48" y="130" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="130" width="16" height="170" rx="8" fill="#B23B3B"/><text x="92" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Storm and insurance</text><text x="92" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Spikes after hail and wind events</text><text x="92" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Inspection first, claim help second</text><rect x="48" y="322" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="322" width="16" height="170" rx="8" fill="#3038D8"/><text x="92" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Replacement</text><text x="92" y="422" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Planned weeks or months ahead</text><text x="92" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Estimate, financing, proof of past work</text><rect x="48" y="514" width="904" height="170" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="514" width="16" height="170" rx="8" fill="#1F8A3B"/><text x="92" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#181C4F" text-anchor="start">Repair and leaks</text><text x="92" y="614" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Urgent, mostly phone calls</text><text x="92" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#3A3E6A" text-anchor="start">Answer fast, book the visit</text><text x="952" y="726" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
