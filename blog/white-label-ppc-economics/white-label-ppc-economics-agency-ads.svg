<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 792" role="img" aria-label="What 52 US agencies did in their Facebook ads"><rect width="1000" height="792" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">What 52 agencies did on Facebook</text><text x="48" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">At least one video ad</text><rect x="48" y="170" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="170" width="521" height="34" rx="10" fill="#FFAC1C"/><text x="952" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">69.2%</text><text x="48" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">No offer, proof or risk reversal</text><rect x="48" y="262" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="262" width="449" height="34" rx="10" fill="#3038D8"/><text x="952" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">59.6%</text><text x="48" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Named the trade they serve</text><rect x="48" y="354" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="354" width="377" height="34" rx="10" fill="#3038D8"/><text x="952" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">50%</text><text x="48" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">A dollar figure, ROAS or counted result</text><rect x="48" y="446" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="446" width="188" height="34" rx="10" fill="#3038D8"/><text x="952" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">25%</text><text x="48" y="524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Something free or an audit</text><rect x="48" y="538" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="538" width="86" height="34" rx="10" fill="#3038D8"/><text x="952" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">11.5%</text><text x="48" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#181C4F" text-anchor="start">Guarantee, pay for results or no contract</text><rect x="48" y="630" width="754" height="34" rx="10" fill="#E4E5F5"/><rect x="48" y="630" width="86" height="34" rx="10" fill="#3038D8"/><text x="952" y="658" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#181C4F" text-anchor="end">11.5%</text><text x="48" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#4A4E7A" text-anchor="start">Source: Media Puppies marketing agency ads study.</text><text x="952" y="762" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
