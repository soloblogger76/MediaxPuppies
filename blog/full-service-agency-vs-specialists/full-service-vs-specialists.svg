<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 714" role="img" aria-label="Pros of a full service marketing agency compared with specialist agencies"><rect width="1000" height="714" rx="28" fill="#F6F5EF"/><text x="48" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#181C4F" text-anchor="start">Full service vs specialists</text><rect x="48" y="120" width="440" height="514" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="48" y="120" width="440" height="64" rx="22" fill="#1F8A3B"/><rect x="48" y="160" width="440" height="24" fill="#1F8A3B"/><text x="76" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Full service gives you</text><text x="76" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ One contract, one report</text><text x="76" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ One team sees the funnel</text><text x="76" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Less coordination work</text><text x="76" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Faster cross-channel fixes</text><text x="76" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ One owner of the number</text><text x="76" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Simpler for founders</text><rect x="512" y="120" width="440" height="514" rx="22" fill="#FFFFFF" stroke="#D9D8E6" stroke-width="2"/><rect x="512" y="120" width="440" height="64" rx="22" fill="#3038D8"/><rect x="512" y="160" width="440" height="24" fill="#3038D8"/><text x="540" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Specialists give you</text><text x="540" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Deeper skill per channel</text><text x="540" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Replace one part easily</text><text x="540" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Senior people per channel</text><text x="540" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Best tools per discipline</text><text x="540" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Clear accountability</text><text x="540" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#181C4F" text-anchor="start">✓ Mix and match as you grow</text><text x="952" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3038D8" text-anchor="end">mediapuppies.com</text></svg>
