<script>
/* Two jobs, both before the visitor ever sees this screen:
   1. MOVED — /Lead/ and /SEO/ became /lead-generation/ and /seo-services/
      on 2026-09-21. Cloudflare 301s them at the edge, so this only fires
      if a request reaches the origin unproxied.
   2. CASE — GitHub Pages is case-sensitive, so /Services/ 404s while
      /services/ works. Catch a case-only mistake and fix it. */
(function () {
  var here = location.pathname.replace(/\/+$/, '').toLowerCase() + '/';
  var tail = location.search + location.hash;

  var MOVED = {
    '/lead/': '/lead-generation/',
    '/seo/': '/seo-services/',
    /* /contact was indexed on the old host and still gets crawled and typed.
       There has never been a contact page here — the enquiry form is the
       contact page, so send people there rather than to a 404. */

    '/contact-us/': '/lead-generation/',
    /* City pages retired 2026-09-24 — we do not work in these markets, so a
       page claiming we do was a thin page making a claim we could not back. */
    '/performance-marketing-agency-chennai/': '/performance-marketing/',
    '/performance-marketing-agency-pune/': '/performance-marketing/',
    '/performance-marketing-agency-ahmedabad/': '/performance-marketing/',
    '/performance-marketing-agency-jaipur/': '/performance-marketing/',
    '/performance-marketing-agency-lucknow/': '/performance-marketing/',
    '/creative-strategist-internship/': '/careers/',
    /* Posts renamed in October 2026. Each old path also has a redirect stub. */
    '/blog/set-your-own-cpl-target/': '/blog/cost-per-lead-target/',
    '/blog/agency-contract-what-to-check/': '/blog/marketing-agency-contract/',
    '/blog/paid-media-rfp/': '/blog/marketing-agency-rfp/',
    '/blog/pay-per-lead-agencies-the-catch/': '/blog/pay-per-lead-agency/',
    '/blog/where-ad-budget-leaks/': '/blog/wasted-ad-spend/'
  };
  if (MOVED[here]) { location.replace(MOVED[here] + tail); return; }

  var REAL = ['/', '/services/', '/work/', '/careers/', '/internship/',
              '/seo-services/', '/blog/', '/lead-generation/',
              '/cac-calculator/', '/privacy-policy/'];
  for (var i = 0; i < REAL.length; i++) {
    if (REAL[i] === here && REAL[i] !== location.pathname) {
      location.replace(REAL[i] + tail);
      return;
    }
  }
})();
</script>
